name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # ! setup-node@v7 cannot read mise.toml: support landed on its main branch after v7.0.0. Until a release ships it, this step reads the pin and hands it over. Then switch back to `node-version-file: mise.toml`
      - id: node-pin
        run: |
          version=$(sed -n 's/^node = "\(.*\)"$/\1/p' mise.toml)
          test -n "$version" || { echo "::error::No node pin found in mise.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node-pin.outputs.version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
